[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "it-eval-framework"
version = "0.1.0"
description = "Reproducible Italian evaluation framework for autoregressive Hugging Face language models."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10,<3.14"
authors = [
  {name = "Giorgos Peikos"},
]
keywords = ["italian", "language-model", "evaluation", "perplexity", "lighteval"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "datasets>=3.6,<4",
  "huggingface_hub>=0.30.2,<1.0",
  "pandas>=2.2.0",
  "pydantic>=2.9.0",
  "pyyaml>=6.0.0",
  "torch>=2.1.0",
  "transformers>=4.54.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]

[project.urls]
Homepage = "https://github.com/GiorgosPeikos/it_eval_autoregressive_llms"
Documentation = "https://github.com/GiorgosPeikos/it_eval_autoregressive_llms/blob/main/docs/USER_GUIDE.md"
Repository = "https://github.com/GiorgosPeikos/it_eval_autoregressive_llms"
Issues = "https://github.com/GiorgosPeikos/it_eval_autoregressive_llms/issues"

[project.scripts]
it-eval = "it_eval_framework.cli:main"
it-eval-run-all = "it_eval_framework.runners.run_all:main"
it-eval-run-lighteval = "it_eval_framework.runners.run_lighteval:main"
it-eval-run-blimp-it = "it_eval_framework.runners.run_blimp_it:main"
it-eval-run-perplexity = "it_eval_framework.runners.run_perplexity:main"
it-eval-run-generation = "it_eval_framework.runners.run_generation:main"
it-eval-aggregate = "it_eval_framework.reporting.aggregate_results:main"
it-eval-compare = "it_eval_framework.reporting.compare_checkpoints:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
it_eval_framework = ["resources/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

name: tests

on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned test environment
        run: |
          python -m pip install "pip<27" "setuptools<82" wheel
          python -m pip install "lighteval[multilingual]==0.13.0" --no-deps
          python -m pip install -r constraints/lighteval-python310-313.txt
          python -m pip install -e .[dev] --no-deps
      - name: Compile and test
        run: |
          python -m compileall -q src tests
          python -m pytest -q

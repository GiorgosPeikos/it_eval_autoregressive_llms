run_name: lighteval_task_probe
model:
  source: "sshleifer/tiny-gpt2"
  tokenizer_source: "sshleifer/tiny-gpt2"
  dtype: auto
  device: cpu
  batch_size: 1
output:
  root_dir: evaluation_results
  overwrite: false
  save_details: true
runtime:
  seed: 13
  python_executable: "python"
  lighteval_command: "lighteval"
lighteval:
  enabled: true
  suite: null
  task_aliases:
    - "xcopa.cf"
  max_samples: 2
  dataset_loading_processes: 1
blimp_it:
  enabled: false
perplexity:
  enabled: false
generation:
  enabled: false
